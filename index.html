<html lang="ko">
  <head>
    <title>주소 찾기</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #layer { width: 100%; height: 100%; }
    </style>
  </head>
  <body onload="execDaumPostcode()">
    <div id="layer"></div>

    <!-- 최신 스크립트 주소 사용 -->
    <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
      function postMessageToiOS(postData) {
          try {
              // iOS (WKWebView) 메시지 핸들러 호출
              window.webkit.messageHandlers.callBackHandler.postMessage(postData);
          } catch(err) {
              console.log("iOS 환경이 아닙니다.");
          }
      }

      var element_layer = document.getElementById('layer');

      function execDaumPostcode() {
        new daum.Postcode({
          oncomplete: function(data) {
            var jibunAddress = data.jibunAddress || data.autoJibunAddress || "";
            
            var postData = {
                roadAddress : data.roadAddress,
                jibunAddress : jibunAddress,
                zonecode : data.zonecode
            };
            
            postMessageToiOS(postData);
          },
          width : '100%',
          height : '100%'
        }).embed(element_layer);
      }
    </script>
  </body>
</html>
